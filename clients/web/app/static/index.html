<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasel</title>
<style>
  :root {
    --bg: #f4f6f5;
    --surface: #ffffff;
    --text: #17201c;
    --muted: #66726c;
    --border: #dfe5e2;
    --accent: #0f7b5f;
    --accent-text: #ffffff;
    --mine: #dff3ea;
    --error: #b42318;
    --error-bg: #fdecea;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.06);
    --record: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412;
      --surface: #19211d;
      --text: #e6ece9;
      --muted: #93a19a;
      --border: #2a3530;
      --accent: #3fbf96;
      --accent-text: #08130f;
      --mine: #1d3a2f;
      --error: #ff8a80;
      --error-bg: #3a1d1b;
      --shadow: none;
      --record: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
  }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-weight: 700;
  }
  .who { flex: 1; min-width: 0; }
  .who h1 { font-size: 16px; margin: 0; }
  .who p { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: var(--accent); }
  button {
    font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 6px 12px;
  }
  button:hover { border-color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }

  .empty { margin: auto 0; text-align: center; color: var(--muted); padding: 24px 0; }
  .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  .empty p { margin: 0 auto 16px; max-width: 460px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button { font-size: 13.5px; }

  .msg { max-width: min(80%, 560px); padding: 8px 12px; border-radius: 14px; box-shadow: var(--shadow);
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg a { color: var(--accent); }
  .me { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
  .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; text-align: end; }
  .failed .meta { color: var(--error); }
  .error { align-self: center; max-width: 90%; font-size: 13px; color: var(--error); background: var(--error-bg);
           padding: 6px 12px; border-radius: 8px; text-align: center; }
  .gap { margin-top: 8px; }

  .typing { align-self: flex-start; background: var(--surface); padding: 12px 14px; border-radius: 14px;
            border-bottom-left-radius: 4px; box-shadow: var(--shadow); display: flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface);
  }
  textarea {
    flex: 1; resize: none; max-height: 160px; overflow-y: hidden; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 9px 14px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button { background: var(--accent); color: var(--accent-text); border: none; width: 40px; height: 40px; padding: 0;
                display: grid; place-items: center; flex: none; }
  form button:disabled { opacity: 0.4; cursor: default; }
  form button.ghost { background: transparent; color: var(--muted); }
  form button.ghost:hover { color: var(--accent); }
  form button.recording-on { background: var(--record); color: #fff; }
  [hidden] { display: none !important; }
  .recording { flex: 1; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px;
               border: 1px solid var(--border); border-radius: 20px; background: var(--bg); }
  .recording .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--record); animation: blink 1.2s infinite; }
  .recording span { flex: 1; font-variant-numeric: tabular-nums; }
  .recording button { width: auto; height: auto; background: none; color: var(--muted); padding: 2px 4px; font-size: 13.5px; }

  .msg img { display: block; max-width: 100%; width: 240px; max-height: 320px; object-fit: cover; border-radius: 10px;
             margin: 2px 0 4px; background: var(--border); }
  .msg .label { font-weight: 600; }
  .msg .note { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .msg .note.quote { font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">و</div>
    <div class="who">
      <h1>Wasel · واصل</h1>
      <p><span class="dot" id="dot"></span><span id="status">connecting…</span></p>
    </div>
    <button id="reset" type="button" title="Start over as a brand new user">New chat</button>
  </header>

  <main id="list" aria-live="polite"></main>

  <form id="composer">
    <button id="attach" class="ghost" type="button" aria-label="Send a photo or PDF" title="Send a photo or PDF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m21 11.5-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
    </button>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
    <div id="recording" class="recording" hidden>
      <i class="rec-dot" aria-hidden="true"></i><span id="rec-time">0:00</span>
      <button id="rec-cancel" type="button">Cancel</button>
    </div>
    <textarea id="input" rows="1" placeholder="Message" dir="auto" aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
    <button id="mic" type="button" aria-label="Record a voice note" title="Record a voice note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9Z"/></svg>
    </button>
  </form>
</div>

<script>
const ACCOUNT_KEY = "h4h.web.account";
const SUGGESTIONS = [
  "What can you help me with?",
  "My dad needs a hernia operation, does the ministry cover it? We're Lebanese with no insurance.",
  "How much is Panadol, and is there a cheaper equivalent?",
  "شو رقم الخط الساخن لوزارة الصحة؟",
  "kifak, fi mestashfa 7ekoumi b Saida?",
];

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

let account = store.get(ACCOUNT_KEY) || newAccount();
let chat = loadChat();
let typing = false, typingTimer = null, source = null;
let outbox = Promise.resolve();  // sends go out one at a time, so the agent gets them in order
let recorder = null, recordCancelled = false, recordStarted = 0, recordTimer = null;

const list = document.getElementById("list");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const micButton = document.getElementById("mic");
const fileInput = document.getElementById("file");

function newAccount() {
  const id = crypto.randomUUID();
  store.set(ACCOUNT_KEY, id);
  return id;
}
function chatKey() { return `h4h.web.chat.${account}`; }
function loadChat() {
  try { return JSON.parse(store.get(chatKey())) || []; } catch { return []; }
}
function saveChat() { store.set(chatKey(), JSON.stringify(chat.slice(-500))); }

function setStatus(text, online) {
  document.getElementById("status").textContent = text;
  document.getElementById("dot").classList.toggle("on", online);
}

function connect() {
  if (source) source.close();
  setStatus("connecting…", false);
  source = new EventSource(`api/events?account_id=${account}`);
  source.onopen = () => setStatus(`online · you are web:${account.slice(0, 8)}`, true);
  source.onerror = () => setStatus("reconnecting…", false);
  source.onmessage = (e) => handle(JSON.parse(e.data));
}

function handle(event) {
  if (event.type === "delivered") {
    mark("pending", "delivered");
    setTyping(true);
  } else if (event.type === "reply") {
    setTyping(false);
    add({ who: "agent", text: event.text });
  } else if (event.type === "error") {
    mark("pending", "failed");
    setTyping(false);
    add({ who: "error", text: event.text });
  }
}

function add(message) {
  const entry = { ...message, at: Date.now() };
  chat.push(entry);
  saveChat();
  render();
  return entry;
}

function update(entry, changes) {
  Object.assign(entry, changes);
  saveChat();
  render();
}

function enqueue(work) {
  outbox = outbox.then(work, work);
}

function mark(from, to) {
  chat.forEach((m) => { if (m.who === "me" && m.state === from) m.state = to; });
  saveChat();
  render();
}

function setTyping(on) {
  typing = on;
  clearTimeout(typingTimer);
  if (on) typingTimer = setTimeout(() => setTyping(false), 90000);
  render();
}

function send(text) {
  text = text.trim();
  if (!text) return;
  add({ who: "me", text, state: "pending" });
  enqueue(async () => {
    try {
      const response = await fetch("api/send", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ account_id: account, text }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (e) {
      mark("pending", "failed");
      add({ who: "error", text: `Could not send: ${e.message}` });
    }
  });
}

// A photo, PDF or voice note. The core reads it (transcript or one-line description) and keeps
// photos and PDFs at a link, which replaces the local preview once it is back.
function sendFile(file, kind) {
  const entry = add({
    who: "me", kind, text: "", name: file.name, state: "reading",
    src: kind === "photo" ? URL.createObjectURL(file) : null,
  });
  enqueue(async () => {
    const form = new FormData();
    form.append("account_id", account);
    form.append("file", file, file.name || kind);
    try {
      const response = await fetch("api/media", { method: "POST", body: form });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      const [, tag, link, note] = body.message.match(/^\[(voice note|photo|document)(?: (\S+))?\] ?([\s\S]*)$/) || [];
      update(entry, { state: "pending", note: note ?? body.message, src: link || (kind === "photo" ? entry.src : null) });
    } catch (e) {
      update(entry, { state: "failed" });
      add({ who: "error", text: `Could not send the ${kind === "voice" ? "voice note" : kind}: ${e.message}` });
    }
  });
}

function pickFile() {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (file) sendFile(file, file.type === "application/pdf" ? "document" : "photo");
}

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    add({ who: "error", text: `The microphone is not available: ${e.message}` });
    return;
  }
  const mimeType = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].find((t) => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const type = recorder.mimeType || mimeType || "audio/webm";
    const long = Date.now() - recordStarted > 700;
    recorder = null;
    clearInterval(recordTimer);
    updateComposer();
    if (recordCancelled || !long || !chunks.length) return;
    const extension = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    sendFile(new File(chunks, `voice-note.${extension}`, { type }), "voice");
  };
  recordCancelled = false;
  recordStarted = Date.now();
  recorder.start();
  recordTimer = setInterval(updateComposer, 250);
  updateComposer();
}

function stopRecording(cancel) {
  recordCancelled = cancel;
  recorder?.stop();
}

function updateComposer() {
  const recording = !!recorder;
  const hasText = !!input.value.trim();
  document.getElementById("recording").hidden = !recording;
  document.getElementById("attach").hidden = recording;
  input.hidden = recording;
  sendButton.hidden = recording || !hasText;
  sendButton.disabled = !hasText;
  micButton.hidden = !recording && hasText;
  micButton.classList.toggle("recording-on", recording);
  micButton.setAttribute("aria-label", recording ? "Send the voice note" : "Record a voice note");
  micButton.title = micButton.getAttribute("aria-label");
  if (recording) {
    const seconds = Math.floor((Date.now() - recordStarted) / 1000);
    document.getElementById("rec-time").textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }
}

// Text with bare URLs turned into links, built from DOM nodes so nothing is parsed as HTML.
function linkified(text) {
  const fragment = document.createDocumentFragment();
  const url = /https?:\/\/[^\s<>"]+[^\s<>".,;:!?)\]]/g;
  let last = 0;
  for (const match of text.matchAll(url)) {
    fragment.append(text.slice(last, match.index));
    const a = document.createElement("a");
    a.href = match[0];
    a.textContent = match[0];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    fragment.append(a);
    last = match.index + match[0].length;
  }
  fragment.append(text.slice(last));
  return fragment;
}

function content(m) {
  if (!m.kind) return [linkified(m.text)];
  const parts = [];
  if (m.kind === "photo" && m.src) {
    const img = document.createElement("img");
    img.src = m.src;
    img.alt = m.note || "Photo";
    parts.push(img);
  } else {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = m.kind === "voice" ? "🎤 Voice note" : `📄 ${m.name || "Document"}`;
    parts.push(label);
  }
  if (m.note) {
    const note = document.createElement("span");
    note.className = m.kind === "voice" ? "note quote" : "note";
    note.textContent = m.kind === "voice" ? `“${m.note}”` : m.note;
    parts.push(note);
  }
  return parts;
}

const TICKS = { reading: "reading…", pending: "🕓", delivered: "✓✓", failed: "not sent" };

function render() {
  list.replaceChildren();
  if (chat.length === 0 && !typing) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h2>Ask Wasel</h2>
      <p>Ask about the Ministry of Public Health in English, Arabic or Arabizi, by text or voice note.
      Send photos of your papers when Wasel asks for them.</p>`;
    const chips = document.createElement("div");
    chips.className = "chips";
    for (const s of SUGGESTIONS) {
      const b = document.createElement("button");
      b.type = "button";
      b.dir = "auto";
      b.textContent = s;
      b.onclick = () => send(s);
      chips.append(b);
    }
    empty.append(chips);
    list.append(empty);
    return;
  }
  let previous = null;
  for (const m of chat) {
    const el = document.createElement("div");
    el.className = `msg ${m.who}` + (m.state === "failed" ? " failed" : "");
    if (m.who === "error") el.className = "error";
    if (previous && previous !== m.who) el.classList.add("gap");
    el.dir = "auto";
    el.append(...content(m));
    if (m.who !== "error") {
      const meta = document.createElement("span");
      meta.className = "meta";
      const time = new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      meta.textContent = m.who === "me" ? `${time} ${TICKS[m.state] || ""}` : time;
      el.append(meta);
    }
    list.append(el);
    previous = m.who;
  }
  if (typing) {
    const dots = document.createElement("div");
    dots.className = "typing gap";
    dots.setAttribute("aria-label", "The agent is typing");
    dots.innerHTML = "<span></span><span></span><span></span>";
    list.append(dots);
  }
  list.scrollTop = list.scrollHeight;
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value;
  input.value = "";
  resize();
  send(text);
  input.focus();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});
function resize() {
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight + 2}px`;  // + the border
  input.style.overflowY = input.scrollHeight > 160 ? "auto" : "hidden";
  updateComposer();
}
input.addEventListener("input", resize);
document.getElementById("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", pickFile);
micButton.addEventListener("click", () => (recorder ? stopRecording(false) : startRecording()));
document.getElementById("rec-cancel").addEventListener("click", () => stopRecording(true));

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Start over as a brand new user? The agent will not know this chat.")) return;
  store.remove(chatKey());
  account = newAccount();
  chat = [];
  setTyping(false);
  connect();
});

// Previews of photos still uploading when the page closed are gone; their sends did not finish.
chat.forEach((m) => { if (m.state === "reading") { m.state = "failed"; if (m.src?.startsWith("blob:")) m.src = null; } });
render();
updateComposer();
connect();
input.focus();
</script>
</body>
</html>
