<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d5c48">
<title>Wasel · واصل</title>
<link rel="icon" href="static/logo.svg" type="image/svg+xml">
<style>
  /* The chat, full page at /chat and inside the widget (?embed=widget) or the landing page (?embed=inline).
     System fonts only: it loads inside other sites, so it pulls nothing from third parties. */
  :root {
    --color-paper: oklch(97.4% 0.010 90);
    --color-surface: oklch(99.4% 0.004 90);
    --color-ink: oklch(23% 0.035 170);
    --color-muted: oklch(47% 0.020 165);
    --color-rule: oklch(89% 0.012 120);
    --color-accent: oklch(43% 0.085 168);
    --color-accent-ink: oklch(97% 0.012 90);
    --color-mine: oklch(93% 0.035 165);
    --color-sand: oklch(93.5% 0.025 85);
    --color-error: oklch(48% 0.16 28);
    --color-error-bg: oklch(95% 0.03 28);
    --color-record: oklch(56% 0.19 28);
    --shadow: 0 1px 1.5px oklch(23% 0.035 170 / 0.08);
    --font-body: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", "Geeza Pro", "Noto Sans", sans-serif;
    --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-paper: oklch(17% 0.014 170);
      --color-surface: oklch(22% 0.016 170);
      --color-ink: oklch(93% 0.010 100);
      --color-muted: oklch(72% 0.016 160);
      --color-rule: oklch(31% 0.016 170);
      --color-accent: oklch(74% 0.110 165);
      --color-accent-ink: oklch(18% 0.03 170);
      --color-mine: oklch(32% 0.045 168);
      --color-sand: oklch(30% 0.02 85);
      --color-error: oklch(78% 0.12 28);
      --color-error-bg: oklch(30% 0.05 28);
      --color-record: oklch(70% 0.17 28);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: clip; }
  body { background: var(--color-paper); color: var(--color-ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 780px; margin: 0 auto; }
  .embedded .app { max-width: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px;
    background: var(--color-surface); border-bottom: 1px solid var(--color-rule);
  }
  [dir="rtl"] header { padding: 10px 16px 10px 12px; }
  .avatar { width: 38px; height: 38px; border-radius: 11px; flex: none; display: block; }
  .who { flex: 1; min-width: 0; }
  .who h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.005em; }
  .who h1 span { color: var(--color-muted); font-weight: 500; }
  .who p { margin: 0; font-size: 12.5px; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--color-muted); margin-inline-end: 6px; vertical-align: 1px; }
  .dot.on { background: oklch(62% 0.15 150); }
  .tool {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 9px;
    border: 1px solid transparent; background: none; color: var(--color-muted); font-size: 13px; white-space: nowrap;
    transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
  }
  .tool:hover { background: var(--color-paper); color: var(--color-ink); }
  .tool:active { transform: translateY(1px); }
  .tool.armed { color: var(--color-error); border-color: currentColor; }
  .tool.icon { width: 34px; padding: 0; justify-content: center; }

  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }

  .welcome { margin: auto 0; padding: 20px 4px; display: grid; gap: 14px; justify-items: center; text-align: center; }
  .welcome img { width: 56px; height: 56px; border-radius: 16px; }
  .welcome h2 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .welcome p { margin: 0; max-width: 420px; color: var(--color-muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
  .chips button {
    font-size: 13.5px; line-height: 1.35; text-align: start; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--color-rule); background: var(--color-surface); max-width: 100%;
    transition: border-color 120ms var(--ease-out), background-color 120ms var(--ease-out);
  }
  .chips button:hover { border-color: var(--color-accent); }
  .chips button:active { background: var(--color-mine); }
  .fine { font-size: 12px !important; max-width: 380px; }
  .starter { display: grid; gap: 10px; justify-items: start; }
  .starter .chips { justify-content: flex-start; }

  .msg { max-width: min(82%, 560px); padding: 8px 12px 6px; border-radius: 14px; box-shadow: var(--shadow);
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg a { color: var(--color-accent); text-underline-offset: 2px; }
  .me { align-self: flex-end; background: var(--color-mine); border-end-end-radius: 4px; }
  .agent { align-self: flex-start; background: var(--color-surface); border-end-start-radius: 4px; }
  .meta { display: block; font-size: 11px; color: var(--color-muted); margin-top: 2px; text-align: end; font-variant-numeric: tabular-nums; }
  .failed .meta { color: var(--color-error); }
  .notice { align-self: center; max-width: 92%; font-size: 13px; color: var(--color-error); background: var(--color-error-bg);
            padding: 7px 12px; border-radius: 10px; text-align: center; }
  .gap { margin-top: 8px; }
  .msg img { display: block; max-width: 100%; width: 240px; max-height: 320px; object-fit: cover; border-radius: 10px;
             margin: 2px 0 4px; background: var(--color-rule); }
  .msg .label { font-weight: 600; }
  .msg .note { display: block; font-size: 13px; color: var(--color-muted); margin-top: 2px; }
  .msg .note.quote { font-style: italic; }

  .typing { align-self: flex-start; background: var(--color-surface); padding: 12px 14px; border-radius: 14px;
            border-end-start-radius: 4px; box-shadow: var(--shadow); display: flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--color-muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 8px; align-items: flex-end; background: var(--color-surface);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--color-rule);
  }
  textarea {
    flex: 1; min-width: 0; resize: none; max-height: 160px; overflow-y: hidden; font: inherit; color: var(--color-ink);
    background: var(--color-paper); border: 1px solid var(--color-rule); border-radius: 20px; padding: 9px 14px; outline: none;
  }
  textarea:focus { border-color: var(--color-accent); }
  textarea::placeholder { color: var(--color-muted); }
  form > button { width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; display: grid; place-items: center; flex: none;
                  background: var(--color-accent); color: var(--color-accent-ink); transition: opacity 120ms var(--ease-out); }
  form > button:active { transform: scale(0.96); }
  form > button:disabled { opacity: 0.4; cursor: default; }
  form > button.ghost { background: transparent; color: var(--color-muted); }
  form > button.ghost:hover { color: var(--color-accent); }
  form > button.recording-on { background: var(--color-record); color: var(--color-accent-ink); }
  [dir="rtl"] #send svg { transform: scaleX(-1); }
  .recording { flex: 1; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px;
               border: 1px solid var(--color-rule); border-radius: 20px; background: var(--color-paper); }
  .recording .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-record); animation: blink 1.2s infinite; }
  .recording span { flex: 1; font-variant-numeric: tabular-nums; }
  .recording button { background: none; border: none; color: var(--color-muted); padding: 2px 4px; font-size: 13.5px; }
  .disclaimer { margin: 0; padding: 0 16px 8px; background: var(--color-surface); color: var(--color-muted); font-size: 11.5px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .typing span, .recording .rec-dot { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="avatar" src="static/logo.svg" alt="">
    <div class="who">
      <h1>Wasel <span>· واصل</span></h1>
      <p><span class="dot" id="dot"></span><span id="status" aria-live="polite"></span></p>
    </div>
    <button id="reset" class="tool" type="button"></button>
    <button id="close" class="tool icon" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>

  <main id="list" aria-live="polite"></main>

  <form id="composer">
    <button id="attach" class="ghost" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m21 11.5-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
    </button>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
    <div id="recording" class="recording" hidden>
      <i class="rec-dot" aria-hidden="true"></i><span id="rec-time">0:00</span>
      <button id="rec-cancel" type="button"></button>
    </div>
    <textarea id="input" rows="1" dir="auto"></textarea>
    <button id="send" type="submit" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
    <button id="mic" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9Z"/></svg>
    </button>
  </form>
  <p class="disclaimer" id="disclaimer"></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const EMBED = params.get("embed");  // "widget" (has a close button) or "inline" (inside the landing page)
const NS = (params.get("ns") || "").replace(/[^a-z0-9-]/gi, "");  // a separate conversation per demo frame
const ACCOUNT_KEY = "h4h.web.account" + (NS ? `.${NS}` : "");
const LANG_KEY = "wasel.lang";

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

const TEXT = {
  en: {
    subtitle: "Ministry of Public Health assistant",
    connecting: "connecting…", online: "online", reconnecting: "reconnecting…",
    newChat: "New chat", confirmNew: "Tap again to start over", close: "Close the chat",
    attach: "Send a photo or PDF", send: "Send", record: "Record a voice note", stopRecord: "Send the voice note",
    cancel: "Cancel", placeholder: "Ask about ministry services…", typing: "Wasel is typing",
    greeting: "Hi, I'm Wasel, the assistant for the Ministry of Public Health's services. Ask me about services and how to apply, what the ministry covers, medicine prices, or hospitals and health centres, and I can prepare some requests with you. This chat is private: ministry staff never read it. How can I help you today?",
    welcomeTitle: "Ask about the Ministry of Public Health",
    welcomeBody: "Services and how to apply, what the ministry covers, medicine prices, hospitals and health centres. Write in Arabic, English or Arabizi, or send a voice note.",
    fine: "Answers come from moph.gov.lb. Wasel never gives a diagnosis.",
    disclaimer: "Private chat · answers from moph.gov.lb · not a diagnosis · emergency: 140",
    voice: "Voice note", document: "Document", photo: "Photo", reading: "reading…", notSent: "not sent",
    errReach: "Wasel can't be reached right now. Please try again in a moment.",
    errSend: "Your message didn't go through. Check your connection and try again.",
    errMedia: (kind) => `The ${kind} couldn't be sent. Try again, or send a different file.`,
    errMic: "The microphone isn't available. Allow microphone access, or type instead.",
    suggestions: [
      "What can you help me with?",
      "My dad needs an operation and has no insurance. Does the ministry cover it?",
      "How much is Panadol, and is there a cheaper equivalent?",
      "Government hospitals near Saida",
      "kifak, chou fik tsa3edne?",
    ],
  },
  ar: {
    subtitle: "مساعد وزارة الصحة العامة",
    connecting: "عم يتّصل…", online: "متّصل", reconnecting: "عم يعيد الاتصال…",
    newChat: "محادثة جديدة", confirmNew: "اضغط مرة تانية لتبدأ من جديد", close: "سكّر المحادثة",
    attach: "ابعت صورة أو PDF", send: "إرسال", record: "سجّل رسالة صوتية", stopRecord: "ابعت الرسالة الصوتية",
    cancel: "إلغاء", placeholder: "اسأل عن خدمات الوزارة…", typing: "واصل عم يكتب",
    greeting: "أهلا، أنا واصل، مساعد خدمات وزارة الصحة العامة. اسألني عن الخدمات وكيف تقدّم عليها، شو بتغطّي الوزارة، أسعار الأدوية، أو المستشفيات والمراكز الصحية، وفيني حضّر معك بعض الطلبات. هالمحادثة خاصة: موظفين الوزارة ما بيقروها. كيف فيني ساعدك اليوم؟",
    welcomeTitle: "اسأل عن وزارة الصحة العامة",
    welcomeBody: "الخدمات وكيف تقدّم، شو بتغطّي الوزارة، أسعار الأدوية، المستشفيات والمراكز الصحية. اكتب بالعربي أو الإنكليزي أو بالأحرف اللاتينية، أو ابعت رسالة صوتية.",
    fine: "الأجوبة من موقع الوزارة moph.gov.lb. واصل ما بيعطي تشخيص طبي.",
    disclaimer: "محادثة خاصة · الأجوبة من moph.gov.lb · مش تشخيص طبي · للطوارئ: 140",
    voice: "رسالة صوتية", document: "مستند", photo: "صورة", reading: "عم يقرأ…", notSent: "ما انبعتت",
    errReach: "ما فينا نوصل لواصل هلّق. جرّب كمان شوي.",
    errSend: "ما انبعتت رسالتك. تأكد من الاتصال وجرّب مرة تانية.",
    errMedia: () => "ما انبعت الملف. جرّب مرة تانية أو ابعت ملف تاني.",
    errMic: "الميكروفون مش متاح. اسمح باستعماله أو اكتب رسالتك.",
    suggestions: [
      "شو فيك تساعدني؟",
      "بيي بدو عملية وما عندو ضمان، الوزارة بتغطّي؟",
      "قديش سعر البنادول؟ وفي بديل أرخص؟",
      "شو رقم الخط الساخن لوزارة الصحة؟",
      "kifak, fi mestashfa 7ekoumi b Saida?",
    ],
  },
};

const LANGS = ["ar", "en"];
const lang = LANGS.includes(params.get("lang")) ? params.get("lang")
  : LANGS.includes(store.get(LANG_KEY)) ? store.get(LANG_KEY)
  : (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
const t = TEXT[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
if (EMBED) document.documentElement.classList.add("embedded");

let account = store.get(ACCOUNT_KEY) || newAccount();
let chat = loadChat();
let typing = false, typingTimer = null, source = null, online = false;
let outbox = Promise.resolve();  // sends go out one at a time, so the agent gets them in order
let recorder = null, recordCancelled = false, recordStarted = 0, recordTimer = null;
let resetArmed = null;

const $ = (id) => document.getElementById(id);
const list = $("list"), input = $("input"), sendButton = $("send"), micButton = $("mic"), fileInput = $("file");

function label(el, text) { el.setAttribute("aria-label", text); el.title = text; }
function applyText() {
  $("disclaimer").textContent = t.disclaimer;
  $("reset").textContent = resetArmed ? t.confirmNew : t.newChat;
  $("reset").classList.toggle("armed", !!resetArmed);
  $("rec-cancel").textContent = t.cancel;
  input.placeholder = t.placeholder;
  label(input, t.placeholder);
  label($("attach"), t.attach);
  label(sendButton, t.send);
  label($("close"), t.close);
}

function newAccount() {
  const id = crypto.randomUUID();
  store.set(ACCOUNT_KEY, id);
  return id;
}
function chatKey() { return `h4h.web.chat.${account}`; }
function loadChat() {
  try { return JSON.parse(store.get(chatKey())) || []; } catch { return []; }
}
function saveChat() { store.set(chatKey(), JSON.stringify(chat.slice(-500))); }

function setStatus(state) {
  online = state === "online";
  $("status").textContent = online ? `${t.subtitle} · ${t.online}` : t[state];
  $("dot").classList.toggle("on", online);
}

function tellParent(type, extra = {}) {
  if (EMBED && parent !== window) parent.postMessage({ type: `wasel:${type}`, ...extra }, "*");
}

function connect() {
  if (source) source.close();
  setStatus("connecting");
  source = new EventSource(`api/events?account_id=${account}`);
  source.onopen = () => setStatus("online");
  source.onerror = () => setStatus("reconnecting");
  source.onmessage = (e) => handle(JSON.parse(e.data));
}

function handle(event) {
  if (event.type === "delivered") {
    mark("pending", "delivered");
    setTyping(true);
  } else if (event.type === "reply") {
    setTyping(false);
    add({ who: "agent", text: event.text });
    tellParent("reply");
  } else if (event.type === "error") {
    console.warn("Wasel:", event.text);
    mark("pending", "failed");
    setTyping(false);
    add({ who: "notice", text: t.errReach });
  }
}

function add(message) {
  const entry = { ...message, at: Date.now() };
  chat.push(entry);
  saveChat();
  render();
  return entry;
}

function update(entry, changes) {
  Object.assign(entry, changes);
  saveChat();
  render();
}

function enqueue(work) {
  outbox = outbox.then(work, work);
}

function mark(from, to) {
  chat.forEach((m) => { if (m.who === "me" && m.state === from) m.state = to; });
  saveChat();
  render();
}

function setTyping(on) {
  typing = on;
  clearTimeout(typingTimer);
  if (on) typingTimer = setTimeout(() => setTyping(false), 90000);
  render();
}

// Embedded, the chat opens on Wasel's hello. The first message keeps it in the chat and sends it along,
// so the core records it as Wasel's opening line and the agent doesn't introduce itself a second time.
function opening() {
  if (!EMBED || chat.length) return null;
  add({ who: "agent", text: t.greeting });
  return t.greeting;
}

function send(text) {
  text = text.trim();
  if (!text) return;
  const greeting = opening();
  add({ who: "me", text, state: "pending" });
  enqueue(async () => {
    try {
      const response = await fetch("api/send", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ account_id: account, text, ...(greeting && { greeting }) }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (e) {
      console.warn("Wasel: send failed", e);
      mark("pending", "failed");
      add({ who: "notice", text: t.errSend });
    }
  });
}

// A photo, PDF or voice note. The core reads it (transcript or one-line description) and keeps
// photos and PDFs at a link, which replaces the local preview once it is back.
function sendFile(file, kind) {
  const greeting = opening();
  const entry = add({
    who: "me", kind, text: "", name: file.name, state: "reading",
    src: kind === "photo" ? URL.createObjectURL(file) : null,
  });
  enqueue(async () => {
    const form = new FormData();
    form.append("account_id", account);
    form.append("file", file, file.name || kind);
    if (greeting) form.append("greeting", greeting);
    try {
      const response = await fetch("api/media", { method: "POST", body: form });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      const [, , link, note] = body.message.match(/^\[(voice note|photo|document)(?: (\S+))?\] ?([\s\S]*)$/) || [];
      update(entry, { state: "pending", note: note ?? body.message, src: link || (kind === "photo" ? entry.src : null) });
    } catch (e) {
      console.warn("Wasel: upload failed", e);
      update(entry, { state: "failed" });
      add({ who: "notice", text: t.errMedia(kind === "voice" ? "voice note" : kind) });
    }
  });
}

function pickFile() {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (file) sendFile(file, file.type === "application/pdf" ? "document" : "photo");
}

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    console.warn("Wasel: microphone", e);
    add({ who: "notice", text: t.errMic });
    return;
  }
  const mimeType = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].find((type) => MediaRecorder.isTypeSupported(type));
  const chunks = [];
  recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    const type = recorder.mimeType || mimeType || "audio/webm";
    const long = Date.now() - recordStarted > 700;
    recorder = null;
    clearInterval(recordTimer);
    updateComposer();
    if (recordCancelled || !long || !chunks.length) return;
    const extension = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    sendFile(new File(chunks, `voice-note.${extension}`, { type }), "voice");
  };
  recordCancelled = false;
  recordStarted = Date.now();
  recorder.start();
  recordTimer = setInterval(updateComposer, 250);
  updateComposer();
}

function stopRecording(cancel) {
  recordCancelled = cancel;
  recorder?.stop();
}

function updateComposer() {
  const recording = !!recorder;
  const hasText = !!input.value.trim();
  $("recording").hidden = !recording;
  $("attach").hidden = recording;
  input.hidden = recording;
  sendButton.hidden = recording || !hasText;
  sendButton.disabled = !hasText;
  micButton.hidden = !recording && hasText;
  micButton.classList.toggle("recording-on", recording);
  label(micButton, recording ? t.stopRecord : t.record);
  if (recording) {
    const seconds = Math.floor((Date.now() - recordStarted) / 1000);
    $("rec-time").textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }
}

// Text with bare URLs turned into links, built from DOM nodes so nothing is parsed as HTML.
function linkified(text) {
  const fragment = document.createDocumentFragment();
  const url = /https?:\/\/[^\s<>"]+[^\s<>".,;:!?)\]]/g;
  let last = 0;
  for (const match of text.matchAll(url)) {
    fragment.append(text.slice(last, match.index));
    const a = document.createElement("a");
    a.href = match[0];
    a.textContent = match[0];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dir = "ltr";
    fragment.append(a);
    last = match.index + match[0].length;
  }
  fragment.append(text.slice(last));
  return fragment;
}

function content(m) {
  if (!m.kind) return [linkified(m.text)];
  const parts = [];
  if (m.kind === "photo" && m.src) {
    const img = document.createElement("img");
    img.src = m.src;
    img.alt = m.note || t.photo;
    parts.push(img);
  } else {
    const name = document.createElement("span");
    name.className = "label";
    name.textContent = m.kind === "voice" ? `🎤 ${t.voice}` : `📄 ${m.name || t.document}`;
    parts.push(name);
  }
  if (m.note) {
    const note = document.createElement("span");
    note.className = m.kind === "voice" ? "note quote" : "note";
    note.textContent = m.kind === "voice" ? `“${m.note}”` : m.note;
    parts.push(note);
  }
  return parts;
}

function welcome() {
  const box = document.createElement("div");
  box.className = "welcome";
  const logo = Object.assign(document.createElement("img"), { src: "static/logo.svg", alt: "" });
  const title = Object.assign(document.createElement("h2"), { textContent: t.welcomeTitle });
  const body = Object.assign(document.createElement("p"), { textContent: t.welcomeBody });
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const s of t.suggestions) {
    const b = Object.assign(document.createElement("button"), { type: "button", dir: "auto", textContent: s });
    b.onclick = () => send(s);
    chips.append(b);
  }
  const fine = Object.assign(document.createElement("p"), { className: "fine", textContent: t.fine });
  box.append(logo, title, body, chips, fine);
  return box;
}

function starter() {
  const box = document.createElement("div");
  box.className = "starter";
  const hello = Object.assign(document.createElement("div"), { className: "msg agent", dir: "auto" });
  hello.append(t.greeting);
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const s of t.suggestions.slice(1)) {  // the first one asks what Wasel can do, which the hello answers
    const b = Object.assign(document.createElement("button"), { type: "button", dir: "auto", textContent: s });
    b.onclick = () => send(s);
    chips.append(b);
  }
  box.append(hello, chips);  // the line under the composer already says where answers come from
  return box;
}

const TICKS = { pending: "🕓", delivered: "✓✓" };

function render() {
  list.replaceChildren();
  if (chat.length === 0 && !typing) {
    list.append(EMBED ? starter() : welcome());
    return;
  }
  let previous = null;
  for (const m of chat) {
    const el = document.createElement("div");
    const who = m.who === "error" ? "notice" : m.who;  // "error" in chats saved by older versions
    el.className = who === "notice" ? "notice" : `msg ${who}` + (m.state === "failed" ? " failed" : "");
    if (previous && previous !== who) el.classList.add("gap");
    el.dir = "auto";
    el.append(...content(m));
    if (who !== "notice") {
      const meta = document.createElement("span");
      meta.className = "meta";
      const time = new Date(m.at).toLocaleTimeString(lang === "ar" ? "ar-LB" : [], { hour: "2-digit", minute: "2-digit" });
      const tick = { reading: t.reading, failed: t.notSent }[m.state] || TICKS[m.state] || "";
      meta.textContent = who === "me" ? `${time} ${tick}` : time;
      el.append(meta);
    }
    list.append(el);
    previous = who;
  }
  if (typing) {
    const dots = document.createElement("div");
    dots.className = "typing gap";
    dots.setAttribute("role", "status");
    dots.setAttribute("aria-label", t.typing);
    dots.innerHTML = "<span></span><span></span><span></span>";
    list.append(dots);
  }
  list.scrollTop = list.scrollHeight;
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value;
  input.value = "";
  resize();
  send(text);
  input.focus();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
function resize() {
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight + 2}px`;  // + the border
  input.style.overflowY = input.scrollHeight > 160 ? "auto" : "hidden";
  updateComposer();
}
input.addEventListener("input", resize);
$("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", pickFile);
micButton.addEventListener("click", () => (recorder ? stopRecording(false) : startRecording()));
$("rec-cancel").addEventListener("click", () => stopRecording(true));

// Starting over forgets this browser's account, so it asks for a second tap instead of a dialog.
$("reset").addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = setTimeout(() => { resetArmed = null; applyText(); }, 3000);
    applyText();
    return;
  }
  clearTimeout(resetArmed);
  resetArmed = null;
  store.remove(chatKey());
  account = newAccount();
  chat = [];
  setTyping(false);
  applyText();
  connect();
});

if (EMBED === "widget") {
  $("close").hidden = false;
  $("close").addEventListener("click", () => tellParent("close"));
}
// The page around the widget can open it on a question ("Ask Wasel about this service").
window.addEventListener("message", (e) => {
  if (e.source !== parent || !e.data || typeof e.data !== "object") return;
  if (e.data.type === "wasel:ask" && typeof e.data.text === "string") send(e.data.text.slice(0, 1000));
  if (e.data.type === "wasel:focus") input.focus({ preventScroll: true });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") tellParent("close"); });

// Previews of photos still uploading when the page closed are gone; their sends did not finish.
chat.forEach((m) => { if (m.state === "reading") { m.state = "failed"; if (m.src?.startsWith("blob:")) m.src = null; } });
applyText();
render();
updateComposer();
connect();
if (!EMBED) input.focus();  // inside another page, focusing would scroll that page to the frame
tellParent("ready");
</script>
</body>
</html>
