# Module registry. One table per module; `uv run h4h module new <name>` adds one.
#   url     the module's backend: MCP server at <url>/mcp, admin API at <url>/api
#   ui_url  the admin UI the panel embeds (optional; defaults to <url>/ui/, the built UI)
#   title   name shown in the admin panel (optional)
# Removing a module from here revokes its token.

[moph]
title = "Ministry Info"
url = "http://localhost:8002"
ui_url = "http://localhost:5175"

[requests]
title = "Ministry Inbox"
url = "http://localhost:8003"
ui_url = "http://localhost:5176"
