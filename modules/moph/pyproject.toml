[project]
name = "moph"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "h4h",
    "openai>=1.60",
    "pinecone>=10.0",
    "rapidfuzz>=3.9",
]

[tool.uv.sources]
h4h = { path = "../../sdk/python", editable = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"  # the search clients live on one event loop
