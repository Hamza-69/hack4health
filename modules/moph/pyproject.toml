[project]
name = "moph"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "h4h",
    "numpy>=2.1",
    "openai>=1.60",
    "rapidfuzz>=3.9",
    "snowballstemmer>=2.2",
]

[tool.uv.sources]
h4h = { path = "../../sdk/python", editable = true }

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
